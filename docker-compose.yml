version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./temp:/app/temp
      - ./state.db:/app/state.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8000/api"
        NEXT_PUBLIC_WS_BASE: "ws://localhost:8000/ws/pipeline"
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:8000/api"
      NEXT_PUBLIC_WS_BASE: "ws://localhost:8000/ws/pipeline"
    ports:
      - "3000:3000"
    depends_on:
      - api
